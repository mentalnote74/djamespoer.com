name: Daily public brief checkpoint
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
      timezone: America/New_York
permissions:
  contents: read
concurrency:
  group: daily-public-brief
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test scripts/scrum-brief/generate.test.mjs
      - run: node scripts/scrum-brief/generate.mjs
      - run: npm run build
        env:
          CI: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: validated-public-brief
          path: src/app/components/daily-scrum-brief/brief.generated.ts
          retention-days: 14
# No commit/push, production credentials, deploy command, model call or ChatGPT task.
