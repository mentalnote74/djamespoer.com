name: Validate public brief checkpoint
description: Deterministic public metadata validation and build; artifact only.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
      shell: bash
    - run: node --test scripts/scrum-brief/generate.test.mjs
      shell: bash
    - run: node scripts/scrum-brief/generate.mjs
      shell: bash
    - run: npm run build
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: validated-public-brief
        path: src/app/components/daily-scrum-brief/brief.generated.ts
        if-no-files-found: error
        retention-days: 14
