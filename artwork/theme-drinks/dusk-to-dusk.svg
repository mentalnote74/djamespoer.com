<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="dusk-to-dusk-title"><title id="dusk-to-dusk-title">Dusk-to-Dusk</title><desc>A continuous day-cycle arc passes from rose dusk through violet night to golden sunrise and daylight above a shared horizon. Fixed existing sunset, night and sunrise palette anchors; transparent background.</desc><defs><linearGradient id="cycle" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#74334c"/><stop offset=".36" stop-color="#302238"/><stop offset=".68" stop-color="#873323"/><stop offset="1" stop-color="#ffe4b5"/></linearGradient><linearGradient id="horizon" x2="0" y2="1"><stop stop-color="#eac3c1"/><stop offset="1" stop-color="#74334c"/></linearGradient></defs><g transform="translate(3.2 4) scale(.9)" stroke-linecap="round" stroke-linejoin="round"><path d="M12 39A23 23 0 1 1 52 39" fill="none" stroke="url(#cycle)" stroke-width="6"/><path d="M14 22A20 20 0 0 1 28 9" fill="none" stroke="#eac3c1" stroke-opacity=".5" stroke-width="1"/><path d="M14 43Q32 59 50 43" fill="none" stroke="url(#horizon)" stroke-width="4"/><path d="M17 48Q32 59 47 48" fill="none" stroke="#fff3e8" stroke-opacity=".55" stroke-width="1"/><path d="M23 16a7 7 0 1 0 7 10 8 8 0 0 1-7-10Z" fill="#eac3c1" stroke="#74334c" stroke-width=".8"/><path d="m34 15 .7 2.3 2.3.7-2.3.7L34 21l-.7-2.3-2.3-.7 2.3-.7Z" fill="#fff0df"/><circle cx="43" cy="28" r="6" fill="#ffe4b5" stroke="#873323" stroke-width="1"/><path d="m43 18 0-2m8 5 1.5-1.5m1.5 9h2" fill="none" stroke="#873323" stroke-width="1.4"/><path d="M22 41a10 10 0 0 1 20 0" fill="url(#horizon)" stroke="#74334c" stroke-width="1.2"/><path d="M10 41h44" fill="none" stroke="#74334c" stroke-width="1.8"/><path d="M24 45h16m-12 3h8" fill="none" stroke="#dfb9ac" stroke-width="1.2"/></g></svg>