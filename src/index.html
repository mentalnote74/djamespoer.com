    <!-- Google tag (gtag.js) -->
    <script>
      (() => {
        if (!['djamespoer.com', 'www.djamespoer.com'].includes(window.location.hostname)) return;
        // Explicit browser opt-out, not bot classification or an authentication signal.
        // Visit ?internal=1 once; ?internal=0 clears it for this browser/origin.
        try {
          const marker = new URLSearchParams(window.location.search).get('internal');
          if (marker === '1') window.localStorage.setItem('portfolio.analytics.internal', '1');
          if (marker === '0') window.localStorage.removeItem('portfolio.analytics.internal');
          if (window.localStorage.getItem('portfolio.analytics.internal') === '1') return;
        } catch {
          return;
        }
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag('js', new Date());
        // Angular owns page_view after completed navigation; GA history measurement is disabled.
        // Configuration never forwards the browser's arbitrary query/fragment or full referrer.
        let referrer = '';
        try { referrer = document.referrer ? new URL(document.referrer).origin + '/' : ''; } catch {}
        const campaign = {};
        for (const [query, parameter] of [['utm_source','campaign_source'], ['utm_medium','campaign_medium'],
          ['utm_campaign','campaign_name'], ['utm_content','campaign_content'], ['utm_term','campaign_term']]) {
          const value = new URLSearchParams(window.location.search).get(query);
          if (value && /^[a-zA-Z0-9_.-]{1,80}$/.test(value)) campaign[parameter] = value;
        }
        window.gtag('config', 'G-WQBYGF4Z8F', {
          ...campaign,
          send_page_view: false,
          page_location: window.location.origin + '/',
          page_referrer: referrer,
        });

        // Keep third-party startup off the rendering path; clicks can queue before it loads.
        const loadAnalytics = () => {
          const script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-WQBYGF4Z8F';
          document.head.append(script);
        };
        window.addEventListener(
          'portfolio-ready',
          () => {
            const mobile = window.matchMedia('(max-width: 600px)').matches;
            const schedule = () => {
              if ('requestIdleCallback' in window)
                window.requestIdleCallback(loadAnalytics, { timeout: 2000 });
              else window.setTimeout(loadAnalytics, 0);
            };
            // Preserve the queue; mobile third-party work starts after its quiet window.
            if (mobile) window.setTimeout(schedule, 8000);
            else schedule();
          },
          { once: true },
        );
      })();
    </script>
