<app-hero />

<section class="home-history" aria-labelledby="build-deployment-history-heading">
  <div class="home-history__content layout-container">
    <h2 id="build-deployment-history-heading">Build &amp; Deployment History</h2>
    <app-deployment-history />
  </div>
</section>

<app-carousel
  [showPreviousNext]="true"
  [showPausePlay]="true"
  [showSlideNavigation]="false"
  [autoRotate]="true"
  [rotationInterval]="5000"
>
  <ng-template appCarouselSlide label="Engineering">
    <app-perspective-candidate facet="engineering" />
  </ng-template>

  <ng-template appCarouselSlide label="UX &amp; Product">
    <app-perspective-candidate facet="ux" />
  </ng-template>

  <ng-template appCarouselSlide label="Accessibility">
    <app-perspective-candidate facet="accessibility" />
  </ng-template>

  <ng-template appCarouselSlide label="AI &amp; Innovation">
    <app-perspective-candidate facet="ai" />
  </ng-template>

  <ng-template appCarouselSlide label="Creative">
    <h3>Creative</h3>
    <img
      class="home-creative"
      src="/assets/perspectives/creative-2172.webp"
      srcset="
        /assets/perspectives/creative-600.webp   600w,
        /assets/perspectives/creative-1200.webp 1200w,
        /assets/perspectives/creative-1800.webp 1800w,
        /assets/perspectives/creative-2172.webp 2172w
      "
      sizes="(min-width: 1344px) 1152px, calc(100vw - clamp(1rem, 4vw, 2rem) * 2 - clamp(1.5rem, 6vw, 4rem) * 2 - 2px)"
      width="2172"
      height="724"
      loading="lazy"
      decoding="async"
      alt="A densely illustrated town of interconnected autobiographical scenes and visual Easter eggs."
    />
  </ng-template>

  <ng-template appCarouselSlide label="Impact">
    <app-perspective-candidate facet="impact" />
  </ng-template>
</app-carousel>
