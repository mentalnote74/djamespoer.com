@if (content(); as study) {
  <app-case-study
    [study]="study"
    [showTitle]="!composition() && !artwork()"
    [titleVisuallyHidden]="!!artwork()"
  >
    @if (artwork()) {
      <app-slide-hero class="editorial-wide" destination="/creative" [heading]="heading()" />
    }
    @if (composition(); as facet) {
      <app-perspective-slide
        class="proof-page__composition editorial-wide"
        [kind]="facet"
        [pageHeading]="true"
        [showExplore]="false"
      />
    }
  </app-case-study>
} @else {
  <section class="proof-page editorial-content" aria-labelledby="proof-page-heading">
    <h1 id="proof-page-heading">{{ heading() }}</h1>
    @if (artwork(); as image) {
      <img
        class="proof-page__artwork editorial-wide"
        [ngSrc]="image.src"
        [attr.srcset]="image.srcset"
        [attr.sizes]="image.sizes || '100vw'"
        disableOptimizedSrcset
        [alt]="image.alt"
        [width]="image.width"
        [height]="image.height"
        priority
      />
    }

    <p>Portfolio evidence for this perspective will be added in a future content phase.</p>
  </section>
}
