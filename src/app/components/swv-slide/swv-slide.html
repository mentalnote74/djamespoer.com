<div class="swv-scene" carouselExposure="shady-white-van" [exposureActive]="active() && !hero()">
  @if (mounted()) {
    <iframe
      [src]="embedUrl()"
      title="Shady White Van: live rotating custom van and changing visual treatments"
      width="1200"
      height="400"
      loading="eager"
      credentialless
    ></iframe>
  }
  @if (!hero()) {
    <div class="copy">
      <h2>Shady White Van</h2>
      <a
        class="slide-explore"
        routerLink="/case-studies/shady-white-van"
        publicTrack
        trackLocation="carousel"
        trackSource="carousel"
        trackSlide="shady-white-van"
        aria-label="Explore Shady White Van"
        >Explore</a
      >
    </div>
  }
</div>
