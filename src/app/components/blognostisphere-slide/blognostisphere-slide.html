<section class="blognostisphere-scene" [class.running]="running()" aria-label="Blognostisphere">
  <div class="art" aria-hidden="true">
    <div class="world">
      @for (layer of layers; track layer.name) {
        <app-slide-image
          [priority]="hero() && layer.name === 'foreground'"
          [mobileMax]="2172"
          [class]="'plate ' + layer.name"
          [layer]="'blognostisphere/' + layer.name"
          [style.transform-origin]="
            ((layer.x + layer.w / 2) / 2172) * 100 +
            '% ' +
            ((layer.y + layer.h / 2) / 724) * 100 +
            '%'
          "
          sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        />
      }
      <div class="fin-light"></div>
      <div class="vortex-flow"></div>
      <div class="resonator-flow"></div>
      @for (star of stars; track star.x) {
        <i
          class="star"
          [style.left.%]="star.x"
          [style.top.%]="star.y"
          [style.animation-delay]="star.delay"
          [style.animation-duration]="star.duration"
        ></i>
      }
    </div>
  </div>
  <div class="copy">
    @if (!hero()) {
      <h2>Blognostisphere</h2>
    }
    <div class="actions">
      @if (!hero()) {
        <a
          class="action"
          routerLink="/blognostisphere"
          publicTrack
          trackLocation="carousel"
          trackSource="carousel"
          aria-label="Explore Blognostisphere"
          >Explore</a
        >
      }
      <button
        class="action motion-control"
        type="button"
        (click)="toggleMotion()"
        [attr.aria-label]="motionPaused() ? 'Resume artwork motion' : 'Pause artwork motion'"
      >
        @if (motionPaused()) {
          <svg lucidePlay class="action-icon" aria-hidden="true" focusable="false"></svg>
        } @else {
          <svg lucidePause class="action-icon" aria-hidden="true" focusable="false"></svg>
        }
      </button>
    </div>
  </div>
</section>
