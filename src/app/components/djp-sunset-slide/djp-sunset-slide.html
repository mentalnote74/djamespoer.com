<section
  class="djp-beach sunset slide-surface"
  [class.running]="running()"
  aria-label="djamespoer.com — Sunset beach"
>
  @if (!hero()) {
    <a
      class="slide-destination"
      routerLink="/work/djamespoer"
      publicTrack
      trackLocation="carousel"
      trackSource="carousel"
      aria-label="Explore djamespoer.com"
    ></a>
  }
  <div class="art" aria-hidden="true">
    <div class="world">
      <app-slide-image
        [mobileMax]="2172"
        class="background"
        [priority]="priority()"
        layer="sunset/background"
        aria-hidden="true"
        sizes="(max-width: 600px) 180vw, (min-width: 1344px) 1485px, 116vw"
      /><app-slide-image
        [mobileMax]="2172"
        class="shore"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="sunset/shore"
        aria-hidden="true"
      /><app-slide-image
        [mobileMax]="2172"
        class="water-magic"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="sunset/caustics"
        aria-hidden="true"
      /><app-slide-image
        [mobileMax]="2172"
        class="moving-layer"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="sunset/swash"
        aria-hidden="true"
      />
      <div class="light"></div>
      <app-slide-image
        [mobileMax]="2172"
        class="foreground"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="sunset/foreground"
        aria-hidden="true"
      />
    </div>
  </div>
  <div class="copy slide-surface__copy">
    @if (!hero()) {
      <h2>djamespoer.com</h2>
      <p>The portfolio is the proof.</p>
    }
    <div class="actions">
      @if (!hero()) {
        <span class="slide-explore" aria-hidden="true">Explore</span>
      }
      <button
        class="action motion-control slide-motion-control"
        type="button"
        (click)="toggleMotion()"
        [attr.aria-label]="motionPaused() ? 'Resume artwork motion' : 'Pause artwork motion'"
      >
        @if (motionPaused()) {
          <svg lucidePlay class="action-icon" aria-hidden="true" focusable="false"></svg>
        } @else {
          <svg lucidePause class="action-icon" aria-hidden="true" focusable="false"></svg>
        }
      </button>
    </div>
  </div>
</section>
