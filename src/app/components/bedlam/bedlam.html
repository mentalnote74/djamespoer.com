<span #field class="bedlam" aria-hidden="true" [style.--bedlam-motion]="motion()">
  <span class="bedlam__identity">
    <span class="bedlam__mask">
      @for (layer of layers(); track layer.id) {
        <span class="bedlam__plane" [style]="layer.style"></span>
      }
    </span>
  </span>
</span>
