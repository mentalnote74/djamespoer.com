<section
  class="pig-scene slide-surface"
  [class.eligible]="eligible()"
  [class.paused]="motionPaused() || preparationFailed()"
  aria-label="TCC UX philosophy"
>
  @if (!hero()) {
    <a
      class="slide-destination"
      routerLink="/case-studies/tcc"
      publicTrack
      trackLocation="carousel"
      trackSource="carousel"
      aria-label="Explore the TCC case study"
    ></a>
  }
  <div class="art" aria-hidden="true">
    <picture class="static-pig">
      <source media="(prefers-reduced-motion: reduce)" [srcset]="kissFallback" />
      <img [src]="restFallback" width="384" height="128" alt="" />
    </picture>
    <div class="preparing">
      @for (layer of layers; track layer.name) {
        <app-slide-image
          [priority]="hero() && layer.name === 'base'"
          class="plate"
          [layer]="'tcc-pig/' + layer.name"
          (loaded)="checkReady()"
        />
      }
    </div>
    @for (frame of frames(); track frame.id) {
      <div
        class="layered-pig"
        [class.current]="frame.id === presented()"
        [class.paused]="frame.id !== presented()"
        [attr.data-pig-frame]="frame.id"
      >
        @for (layer of layers; track layer.name; let index = $index) {
          <img
            [class]="'plate ' + layer.name"
            [src]="frame.sources[index]"
            width="2172"
            height="724"
            alt=""
            decoding="async"
          />
        }
      </div>
    }
  </div>
  <div class="copy slide-surface__copy">
    @if (!hero()) {
      <h2>Like the status quo? Then pucker up.</h2>
    }
    <div class="actions">
      @if (!hero()) {
        <span class="slide-explore" aria-hidden="true">Explore</span>
      }
      <button
        class="action motion-control slide-motion-control"
        type="button"
        (click)="toggleMotion()"
        [attr.aria-label]="motionPaused() ? 'Resume artwork motion' : 'Pause artwork motion'"
      >
        @if (motionPaused()) {
          <svg lucidePlay class="action-icon" aria-hidden="true" focusable="false"></svg>
        } @else {
          <svg lucidePause class="action-icon" aria-hidden="true" focusable="false"></svg>
        }
      </button>
    </div>
  </div>
</section>
