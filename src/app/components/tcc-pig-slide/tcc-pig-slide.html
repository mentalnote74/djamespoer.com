<section
  class="pig-scene slide-surface"
  [class.eligible]="eligible()"
  [class.paused]="motionPaused()"
  aria-label="TCC UX philosophy"
>
  @if (!hero()) {
    <a
      class="slide-destination"
      routerLink="/case-studies/tcc"
      publicTrack
      trackLocation="carousel"
      trackSource="carousel"
      aria-label="Explore the TCC case study"
    ></a>
  }
  <div class="art" aria-hidden="true">
    @for (layer of layers; track layer.name) {
      <div [class]="'plate ' + layer.name">
        <span
          class="sprite-crop"
          [style.left.%]="(layer.x / 2172) * 100"
          [style.top.%]="(layer.y / 724) * 100"
          [style.width.%]="(layer.w / 2172) * 100"
          [style.height.%]="(layer.h / 724) * 100"
        >
          <picture>
            <source type="image/avif" [srcset]="atlasSrcset('avif')" [sizes]="sizes" />
            <img
              src="/assets/pig-sprite/atlas-1440.webp"
              [srcset]="atlasSrcset('webp')"
              [sizes]="sizes"
              width="2172"
              height="928"
              alt=""
              [loading]="hero() && layer.name === 'base' ? 'eager' : 'lazy'"
              [attr.fetchpriority]="hero() && layer.name === 'base' ? 'high' : null"
              decoding="async"
              [style.width.%]="(2172 / layer.w) * 100"
              [style.height.%]="(928 / layer.h) * 100"
              [style.left.%]="(-layer.sx / layer.w) * 100"
              [style.top.%]="(-layer.sy / layer.h) * 100"
              (load)="checkReady()"
            />
          </picture>
        </span>
      </div>
    }
  </div>
  <div class="copy slide-surface__copy">
    @if (!hero()) {
      <h2>Like the status quo? Then pucker up.</h2>
    }
    <div class="actions">
      @if (!hero()) {
        <span class="slide-explore" aria-hidden="true">Explore</span>
      }
      <button
        class="action motion-control slide-motion-control"
        type="button"
        (click)="toggleMotion()"
        [attr.aria-label]="motionPaused() ? 'Resume artwork motion' : 'Pause artwork motion'"
      >
        @if (motionPaused()) {
          <svg lucidePlay class="action-icon" aria-hidden="true" focusable="false"></svg>
        } @else {
          <svg lucidePause class="action-icon" aria-hidden="true" focusable="false"></svg>
        }
      </button>
    </div>
  </div>
</section>
