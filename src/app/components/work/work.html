<div class="work-page layout-container">
  <h1>Work</h1>
  <p>Case studies and supporting evidence, distinct from the Perspectives on how James works.</p>
  <ul class="work-page__cards">
    @for (project of projects; track project.path) {
      <li>
        <a [routerLink]="project.path"
          ><h2>{{ project.name }}</h2>
          <p>{{ project.description ?? 'View case-study scaffold' }}</p></a
        >
      </li>
    }
  </ul>
</div>
