<div class="artwork-slide slide-surface">
  @if (showExplore()) {
    <a
      class="slide-destination"
      publicTrack
      trackLocation="carousel"
      trackSource="carousel"
      [trackSlide]="kind()"
      [routerLink]="copy().route"
      [attr.aria-label]="'Explore ' + copy().title"
    ></a>
  }
  <picture aria-hidden="true">
    @if (homepageOptimized()) {
      <source
        media="(max-width: 600px)"
        type="image/avif"
        [srcset]="mobileSrcset('avif')"
        [sizes]="sizes"
      />
      <source
        media="(max-width: 600px)"
        type="image/webp"
        [srcset]="mobileSrcset('webp')"
        [sizes]="sizes"
      />
    }
    <source type="image/avif" [srcset]="srcset('avif')" [sizes]="sizes" />
    <img
      #artwork
      [src]="'/assets/perspectives/overnight/' + kind() + '-1200.webp'"
      [srcset]="srcset('webp')"
      [sizes]="sizes"
      width="2172"
      height="724"
      alt=""
      [loading]="active() ? 'eager' : 'lazy'"
      [attr.fetchpriority]="active() ? 'high' : null"
      decoding="async"
      (load)="captureArtwork($event)"
    />
  </picture>
  @defer (when magicReady()) {
    <app-perspective-magic [kind]="kind()" [source]="artworkSource()" [paused]="motionPaused()" />
  }
  <div class="slide-copy slide-surface__copy">
    @if (pageHeading()) {
      <h1>{{ copy().title }}</h1>
    } @else {
      <h2>{{ copy().title }}</h2>
    }
    <p>{{ copy().line }}</p>
    @if (showExplore()) {
      <span class="slide-explore" aria-hidden="true">Explore</span>
    }
  </div>
</div>

@if (pageHeading()) {
  <button
    class="artwork-motion slide-motion-control"
    type="button"
    (click)="motionPaused.set(!motionPaused())"
    [attr.aria-label]="motionPaused() ? 'Resume artwork motion' : 'Pause artwork motion'"
  >
    <span aria-hidden="true">{{ motionPaused() ? 'Resume' : 'Pause' }}</span>
  </button>
}
