<div class="artwork-slide">
  <picture aria-hidden="true">
    <source type="image/avif" [srcset]="srcset('avif')" [sizes]="sizes" />
    <img
      [src]="'/assets/perspectives/overnight/' + kind() + '-1200.webp'"
      [srcset]="srcset('webp')"
      [sizes]="sizes"
      width="2172"
      height="724"
      alt=""
      loading="lazy"
      decoding="async"
    />
  </picture>
  <div class="slide-copy">
    <h2>{{ copy().title }}</h2>
    <p>{{ copy().line }}</p>
    <a [routerLink]="copy().route" [attr.aria-label]="'Explore ' + copy().title">Explore</a>
  </div>
</div>
