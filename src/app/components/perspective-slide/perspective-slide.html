<div class="artwork-slide">
  <picture aria-hidden="true">
    <source type="image/avif" [srcset]="srcset('avif')" [sizes]="sizes" />
    <img
      [src]="'/assets/perspectives/overnight/' + kind() + '-1200.webp'"
      [srcset]="srcset('webp')"
      [sizes]="sizes"
      width="2172"
      height="724"
      alt=""
      [loading]="kind() === 'engineering' ? 'eager' : 'lazy'"
      [attr.fetchpriority]="kind() === 'engineering' ? 'high' : null"
      decoding="async"
    />
  </picture>
  <div class="slide-copy">
    <h2>{{ copy().title }}</h2>
    <p>{{ copy().line }}</p>
    <a
      publicTrack
      trackLocation="carousel"
      trackSource="carousel"
      [trackSlide]="kind()"
      [routerLink]="copy().route"
      [attr.aria-label]="'Explore ' + copy().title"
      >Explore</a
    >
  </div>
</div>
