<section
  class="djp-beach moonlight"
  [class.running]="running()"
  aria-label="djamespoer.com — Moonlit beach"
>
  <div class="art" aria-hidden="true">
    <div class="world">
      <app-slide-image
        [mobileMax]="2172"
        class="background"
        layer="moonlight/background"
        aria-hidden="true"
        sizes="(max-width: 600px) 180vw, (min-width: 1344px) 1485px, 116vw"
      /><app-slide-image
        [mobileMax]="2172"
        class="shore"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="moonlight/shore"
        aria-hidden="true"
      /><app-slide-image
        [mobileMax]="2172"
        class="water-magic near"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="moonlight/glow"
        aria-hidden="true"
      /><app-slide-image
        [mobileMax]="2172"
        class="water-magic far"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="moonlight/glow"
        aria-hidden="true"
      /><app-slide-image
        [mobileMax]="2172"
        class="moving-layer"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="moonlight/cloud"
        aria-hidden="true"
      /><app-slide-image
        [mobileMax]="2172"
        class="moon"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="moonlight/moon"
        aria-hidden="true"
      />
      <div class="light"></div>
      <app-slide-image
        [mobileMax]="2172"
        class="foreground"
        sizes="(max-width: 600px) 150vw, (min-width: 1344px) 1280px, 100vw"
        layer="moonlight/foreground"
        aria-hidden="true"
        [priority]="priority()"
      />
    </div>
  </div>
  <div class="copy">
    @if (!hero()) {
      <h2>djamespoer.com</h2>
      <p>The portfolio is the proof.</p>
    }
    <div class="actions">
      @if (!hero()) {
        <a
          class="action"
          routerLink="/work/djamespoer"
          publicTrack
          trackLocation="carousel"
          trackSource="carousel"
          aria-label="Explore djamespoer.com"
          >Explore</a
        >
      }
      <button
        class="action motion-control"
        type="button"
        (click)="toggleMotion()"
        [attr.aria-label]="motionPaused() ? 'Resume artwork motion' : 'Pause artwork motion'"
      >
        @if (motionPaused()) {
          <svg lucidePlay class="action-icon" aria-hidden="true" focusable="false"></svg>
        } @else {
          <svg lucidePause class="action-icon" aria-hidden="true" focusable="false"></svg>
        }
      </button>
    </div>
  </div>
</section>
