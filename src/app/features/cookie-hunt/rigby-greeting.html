<dialog
  #hello
  class="rigby-greeting"
  aria-labelledby="rigby-introduction"
  (cancel)="maybeLater($event)"
>
  <button class="skip" type="button" (click)="maybeLater()">Skip the greeting</button>
  <div
    class="hello-stage"
    [class.still]="still() || rigby.paused()"
    [class.excited]="playing()"
    aria-hidden="true"
  >
    <div class="hello-runner"><span></span></div>
    <div class="hello-kiss">
      <span></span>
      <svg class="kiss-tongue" viewBox="0 0 60 120" aria-hidden="true" focusable="false">
        <path
          d="M20 5C15 30 8 39 10 69c2 27 13 43 26 42 16-1 17-23 7-46C34 42 42 21 38 5Z"
          fill="#ed8da1"
          stroke="#b95670"
          stroke-width="2"
        />
        <path
          d="M29 12c-8 35-5 62 6 86"
          fill="none"
          stroke="#c96c84"
          stroke-width="2"
          stroke-linecap="round"
        />
        <circle class="kiss-droplet" cx="5" cy="83" r="3" fill="#ed8da1" />
        <circle class="kiss-droplet" cx="55" cy="98" r="2" fill="#ed8da1" />
      </svg>
    </div>
    <div class="hello-jump"><span></span></div>
  </div>
  <section class="introduction" [class.still]="still() || rigby.paused()">
    <h2 #title id="rigby-introduction" tabindex="-1">Hi! I'm Rigby Decaf Poer!!!</h2>
    <p>Top of my class at Teddy Bear School. Certified Gold Star.</p>
    <p role="status">{{ playing() ? "Yay! let's go find some cookies! follow me!" : '' }}</p>
    <div class="greeting-actions">
      <button class="play" type="button" [disabled]="playing()" (click)="startPlaying()">
        <svg
          class="action-icon"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
          focusable="false"
        >
          <ellipse cx="5" cy="8" rx="2.5" ry="3" />
          <ellipse cx="10" cy="5" rx="2.5" ry="3" />
          <ellipse cx="16" cy="5" rx="2.5" ry="3" />
          <ellipse cx="21" cy="9" rx="2.5" ry="3" />
          <path d="M6 17c0-3 3-7 6-7s6 4 6 7c0 5-4 2-6 2s-6 3-6-2Z" />
        </svg>
        <span>Do you want to play with me?</span>
      </button>
      <button type="button" (click)="maybeLater()">
        <svg
          class="action-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M2 11 12 2l10 9h-3v11h-5v-6a2 2 0 0 0-4 0v6H5V11Z" />
        </svg>
        <span>No thanks</span>
      </button>
    </div>
  </section>
</dialog>
