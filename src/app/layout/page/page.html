<main id="main-content" tabindex="-1">
  <div
    class="page__content"
    [class.layout-container]="!independentLayout()"
    [class.page__content--interior]="!independentLayout()"
    [class.page__content--independent]="independentLayout()"
  >
    <router-outlet
      #outlet="outlet"
      (activate)="setLayout(outlet.activatedRoute.snapshot.data['layout'])"
    />
  </div>
</main>
